server {
    listen 80;
    server_name localhost;

    # Docker internal DNS server for resolving 'backend' dynamically
    resolver 127.0.0.11 valid=30s;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve static files and fallback to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container dynamically
    location /api/ {
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}